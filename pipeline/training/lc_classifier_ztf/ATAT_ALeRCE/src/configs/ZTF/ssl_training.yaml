
ATATConfig:
  _target_: src.utils.CustomParser.ATATConfig
  experiment_type: &experiment_type 'default_type'
  save_dir_path: &save_dir_path 'default_savepath'
  log_filename: 'default.log'
  learning_rate: 1e-3
  warmup_steps: 5000
  eta_min_factor: 1e-2
  num_classes: 22

  online_transforms:
    use_window_select: True
    use_max_window_select: True
    use_time_gauss_factor: false
    use_gauss_factor: false
    use_simple_time_factor: true
    use_simple_data_factor: True
    use_band_permute: True
    use_roll: True
    use_gauss_noise: False
    use_time_gauss_noise: False
    use_random_subsample: False
    p_: 0.5

  lc:
    _target_: src.utils.CustomParser.LightcurveArgs
    input_size: 1
    embedding_size: 64
    embedding_size_sub: 64
    num_heads: 4
    num_encoders: 2
    Tmax: 2048.0
    pe_type: 'tm'
    num_harmonics: 1
    num_bands: 2
    dropout: 0.01
    checkpoint: null

    use_acceleration : True
    use_velocity : True
    use_stats : False
    use_features : False
    use_metadata: False
    use_sequence_norm: True
    use_tabular_transformer: False
    use_timefilm_gelu: True
    use_timefilm_norm: True
    use_exp: True
    use_conv: True
    features_num_features: 181
    metadata_num_features: 6
  tab:
    _target_: src.utils.CustomParser.TabularArgs
    embedding_size: 32
    embedding_size_sub: 256
    num_heads: 4
    num_encoders: 3
    length_size: 187
    dropout: 0.05
    checkpoint: null
    sequence_norm: True

  #mode: &mode 'max'
  mode: &mode 'min'

  monitor: null
  datamodule:
    _target_: src.utils.CustomParser.DataModuleArgs
    dataset:
      _target_: src.utils.CustomParser.SSLDatasetArgs
      experiment_type: *experiment_type
      data_root:
        - /home/magdalena/Desktop/sambashare/H5_files/2019/200_2019.h5
        - /home/magdalena/Desktop/sambashare/H5_files/2020/200_2020.h5
        - /home/magdalena/Desktop/sambashare/H5_files/2021/200_2021.h5
        - /home/magdalena/Desktop/sambashare/H5_files/2022/200_2022.h5
       #-/home/magdalena/Desktop/sambashare/H5_files/2023/200_2023.h5
      seed: 0
      train_apply_transform: True
      validation_apply_transform: True
      train_key: 'training'
      validation_key: 'validation'
      test_key: 'test'
      observation_key: flux
      observation_err_key: flux_err
      time_key: time
      time_alert_key: time_alert
      mask_key: mask
      mask_photometry_key: ''
      mask_detection_key: ''
      feature_key: extracted_features
      metadata_key: metadata_feat
      transforms_1: []  # List of transform modules
      transforms_2: []  # List of transform modules
    train_use_sampler: false
    train_shuffle: true
    num_workers: 8
    pin_memory: true
    batch_size: 512
  vicreg:
    shape_projector_1:  '64-64-64'
    shape_projector_2:  '64-64-64'
    inv_coeff: 1
    var_coeff: 25
    cov_coeff: 1
  trainer:
    max_epochs: 100
    devices: 'auto'
    accelerator: 'gpu'
    #radient_clip_val: 1e-3
    num_sanity_val_steps: 0
    min_epochs: 1
    #accumulate_grad_batches: 4
    #val_check_interval: 0.5
    log_every_n_steps: 100

  callbacks:
    learning_rate:
      _target_:  pytorch_lightning.callbacks.LearningRateMonitor
      logging_interval: 'step'
    early_stopping:
      monitor: loss_validation/loss # *monitor #LRegressor/f1-score
      mode: min # *mode
      _target_: pytorch_lightning.callbacks.early_stopping.EarlyStopping
      min_delta: 0.00 # minimum change in the monitored quantity to qualify as an improvement
      patience: 30 # number of checks with no improvement after which training will be stopped
      verbose: False # verbosity mode
      strict: True # whether to crash the training if monitor is not found in the validation metrics
      check_finite: True # when set True, stops training when the monitor becomes NaN or infinite
      stopping_threshold: null # stop training immediately once the monitored quantity reaches this threshold
      divergence_threshold: null # stop training as soon as the monitored quantity becomes worse than this threshold
      check_on_train_epoch_end: null # whether to run early stopping at the end of the training epoch
      # log_rank_zero_only: False  # this keyword argument isn't available in stable version

    model_checkpoint:
      #monitor: LRegressor/f1-score #KNN_3/f1-score
      #mode: max
      monitor: loss_validation/loss # *monitor #LRegressor/f1-score
      mode: min # *mode
      _target_: pytorch_lightning.callbacks.ModelCheckpoint
      dirpath: ''
      filename: pretrain_ckpt_{step} # checkpoint filename
      verbose: False # verbosity mode
      save_last: null # additionally always save an exact copy of the last checkpoint to a file last.ckpt
      #save_top_k: 1 # save k best models (determined by above metric)

      #every_n_epochs: 1
      save_top_k: 1
      auto_insert_metric_name: True # when True, the checkpoints filenames will contain the metric name
      save_weights_only: False # if True, then only the model’s weights will be saved
      every_n_train_steps: null # number of training steps between checkpoints
      train_time_interval: null # checkpoints are monitored at the specified time interval
      every_n_epochs: null # number of epochs between checkpoints
      save_on_train_epoch_end: null # whether to run checkpointing at the end of the training epoch or the end of validation

  loggers:

    tensorboard:
      _target_: pytorch_lightning.loggers.tensorboard.TensorBoardLogger
      name: 'tensorboard'
      version: 0
      save_dir: ''
      log_graph: False
      default_hp_metric: True
      prefix: ""
    csv:
      name: 'metrics'
      version: 0
      save_dir: ''
      _target_: pytorch_lightning.loggers.csv_logs.CSVLogger
      prefix: ""

